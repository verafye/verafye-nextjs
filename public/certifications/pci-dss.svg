<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80" role="img" aria-label="PCI DSS Compliant">
  <!-- TODO: Replace with official PCI DSS badge artwork when received from QSA -->
  <rect x="1" y="1" width="118" height="78" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Credit card icon -->
  <rect x="46" y="14" width="28" height="20" rx="3" fill="none" stroke="#1E6FB7" stroke-width="1.6"/>
  <line x1="46" y1="21" x2="74" y2="21" stroke="#1E6FB7" stroke-width="2"/>
  <line x1="50" y1="27" x2="57" y2="27" stroke="#1E6FB7" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="64.5" cy="27" r="1.75" fill="#1E6FB7"/>
  <circle cx="69" cy="27" r="1.75" fill="#1E6FB7"/>
  <!-- Label -->
  <text x="60" y="50" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="700" fill="#1E293B">PCI DSS</text>
  <text x="60" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="7.5" fill="#64748B">Payment Card Industry</text>
  <text x="60" y="73" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="6.5" font-weight="700" fill="#1E6FB7" letter-spacing="0.8">COMPLIANT</text>
</svg>
