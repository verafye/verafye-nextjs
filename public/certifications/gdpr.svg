<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80" role="img" aria-label="GDPR Compliant">
  <!-- GDPR is a legislative framework, not a certification scheme. Labelled COMPLIANT, not certified. -->
  <rect x="1" y="1" width="118" height="78" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M60 11 L68 15.5 v9.5 q0 10-8 13.5 q-8-3.5-8-13.5 v-9.5 Z" fill="none" stroke="#1E6FB7" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="60" cy="22" r="3" fill="none" stroke="#1E6FB7" stroke-width="1.4"/>
  <line x1="60" y1="25" x2="60" y2="28" stroke="#1E6FB7" stroke-width="1.4" stroke-linecap="round"/>
  <text x="60" y="50" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E293B">GDPR</text>
  <text x="60" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="7.5" fill="#64748B">EU Data Protection</text>
  <text x="60" y="73" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="6.5" font-weight="700" fill="#1E6FB7" letter-spacing="0.8">COMPLIANT</text>
</svg>
